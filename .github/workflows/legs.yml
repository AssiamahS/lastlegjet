name: refresh empty legs

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch_legs.py]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pull feed
        run: python scripts/fetch_legs.py
      - name: commit if changed
        run: |
          if ! git diff --quiet legs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add legs.json
            git commit -m "refresh legs $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
